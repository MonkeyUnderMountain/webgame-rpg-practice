<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Twilight sky beyond the study door">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14192e"/>
      <stop offset="44%" stop-color="#2a2d4e"/>
      <stop offset="76%" stop-color="#7c4e5b"/>
      <stop offset="100%" stop-color="#d89058"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="74%" r="48%">
      <stop offset="0%" stop-color="#f5be78" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#c97458" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#14192e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e3a670" stop-opacity="0"/>
      <stop offset="100%" stop-color="#171929" stop-opacity="0.72"/>
    </linearGradient>
  </defs>

  <rect width="960" height="540" fill="url(#sky)"/>
  <rect width="960" height="540" fill="url(#glow)"/>

  <!-- Stars -->
  <g fill="#f5e3be" opacity="0.75">
    <circle cx="150" cy="84" r="1.6"/>
    <circle cx="242" cy="128" r="1.2"/>
    <circle cx="318" cy="68" r="1.5"/>
    <circle cx="624" cy="92" r="1.4"/>
    <circle cx="748" cy="74" r="1.8"/>
    <circle cx="816" cy="136" r="1.3"/>
    <circle cx="428" cy="112" r="1.1"/>
  </g>
  <!-- Four-point star accent -->
  <path d="M558 102l2.4 6.6 6.6 2.4-6.6 2.4-2.4 6.6-2.4-6.6-6.6-2.4 6.6-2.4Z" fill="#f7e3bc" opacity="0.85"/>

  <!-- Crescent moon -->
  <path d="M474 72a30 30 0 1 0 24 48 24 24 0 1 1-24-48Z" fill="#f2cf94"/>

  <!-- Distant mountain ridges -->
  <path d="M0 374 L128 318 L242 350 L386 286 L526 346 L682 292 L822 338 L960 304 L960 540 L0 540 Z" fill="#282842" opacity="0.82"/>
  <path d="M0 416 L168 364 L310 398 L474 348 L636 392 L788 354 L960 388 L960 540 L0 540 Z" fill="#1b1c30"/>

  <!-- Stone terrace parapet in foreground -->
  <rect x="0" y="456" width="960" height="84" fill="#131524"/>
  <g fill="#222538">
    <rect x="0" y="444" width="110" height="16"/>
    <rect x="130" y="444" width="110" height="16"/>
    <rect x="260" y="444" width="110" height="16"/>
    <rect x="390" y="444" width="110" height="16"/>
    <rect x="520" y="444" width="110" height="16"/>
    <rect x="650" y="444" width="110" height="16"/>
    <rect x="780" y="444" width="110" height="16"/>
    <rect x="910" y="444" width="50" height="16"/>
  </g>
  <rect width="960" height="540" fill="url(#mist)"/>

  <!-- Subtle celestial compass mark -->
  <g stroke="#edc38b" stroke-opacity="0.22" fill="none">
    <circle cx="480" cy="248" r="76" stroke-width="1"/>
    <circle cx="480" cy="248" r="68" stroke-width="0.7" stroke-dasharray="3 5"/>
    <path d="M480 162 V334 M394 248 H566" stroke-width="0.7"/>
  </g>
</svg>
