<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mage Study · Hotspot Debug v3</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: #0b0d12;
      color: #e8e2d7;
      font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .preview {
      width: min(1672px, 100vw);
      margin: 0 auto;
      padding: 18px 18px 28px;
    }
    .stage {
      position: relative;
      aspect-ratio: 1672 / 941;
      overflow: hidden;
      background: #0b0d12;
      box-shadow: 0 20px 80px #0008;
    }
    .stage > img {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      user-select: none;
    }
    .outline-map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .outline {
      fill: rgb(237 195 139 / 1.5%);
      stroke: rgb(237 195 139 / 22%);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
      transition: fill 160ms, stroke 160ms, filter 160ms;
    }
    .outline.is-active {
      fill: rgb(237 195 139 / 13%);
      stroke: #f6d7a6;
      filter: drop-shadow(0 0 6px #edc38b);
    }
    .spot {
      position: absolute;
      z-index: 2;
      pointer-events: none;
    }
    .hotspot {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      padding: 0;
      border: 1px dashed transparent;
      background: transparent;
      color: #fff7eb;
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
      transition: border-color 140ms, background 140ms;
    }
    .hotspot:focus-visible {
      outline: 2px solid #f6d7a6;
      outline-offset: 3px;
    }
    .spot:hover .hotspot,
    .spot:focus-within .hotspot {
      border-color: #edc38b;
      background: rgb(237 195 139 / 8%);
    }
    .badge {
      position: absolute;
      top: 5px;
      left: 5px;
      z-index: 3;
      min-width: 20px;
      padding: 1px 5px;
      border: 1px solid rgb(237 195 139 / 70%);
      background: #11141ce6;
      color: #f6d7a6;
      font: 600 12px/1.4 "Courier New", monospace;
      text-align: center;
      pointer-events: none;
    }
    .label {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 3;
      transform: translate(-50%, -46%);
      padding: 5px 9px;
      background: #11141ce8;
      color: #fff7eb;
      font-size: 13px;
      line-height: 1.2;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 140ms, transform 140ms;
    }
    .spot:hover .label,
    .spot:focus-within .label,
    .spot.is-active .label {
      opacity: 1;
      transform: translate(-50%, -50%);
    }
    .grid {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0;
      transition: opacity 140ms;
      background-image:
        linear-gradient(to right, rgb(0 255 255 / 16%) 1px, transparent 1px),
        linear-gradient(to bottom, rgb(0 255 255 / 16%) 1px, transparent 1px);
      background-size: 5% 5%;
    }
    .stage.show-grid .grid { opacity: 1; }
    .stage.show-boxes .hotspot {
      border-color: rgb(127 231 255 / 65%);
      background: rgb(127 231 255 / 5%);
    }
    .bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 18px;
      padding: 14px 2px 0;
      color: #bcbac2;
      font-size: 13px;
    }
    .bar label { display: inline-flex; align-items: center; gap: 8px; }
    .bar input[type="checkbox"] { accent-color: #edc38b; }
    .bar .note { margin-left: auto; color: #7e7d88; }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 20px;
      padding: 10px 2px 0;
      color: #d8d3c8;
      font-size: 13px;
    }
    .legend b { color: #f6d7a6; font-family: "Courier New", monospace; }
    @media (max-width: 680px) {
      .preview { padding: 10px 10px 20px; }
      .bar { gap: 12px; }
      .bar .note { width: 100%; margin-left: 0; }
    }
  </style>
</head>
<body>
  <main class="preview">
    <div class="stage show-boxes" id="stage">
      <img src="../../../public/art/study/mage/study.png" alt="Mage study with six interactive hotspot shapes.">
      <div class="grid" aria-hidden="true"></div>

      <svg class="outline-map" viewBox="0 0 1672 941" preserveAspectRatio="none" aria-hidden="true">
        <path class="outline" data-hotspot="news" d="M 8 96 L 196 88 L 198 424 L 10 432 Z"></path>
        <path class="outline" data-hotspot="research" d="M 350 88 L 700 72 L 704 392 L 352 410 Z"></path>
        <path class="outline" data-hotspot="profile" d="M 4 480 L 712 480 L 716 904 L 4 904 Z"></path>
        <path class="outline" data-hotspot="notes" d="M 736 20 L 1078 20 L 1080 688 L 736 688 Z"></path>
        <path class="outline" data-hotspot="quests" d="M 1080 500 L 1320 480 L 1320 620 L 1080 640 Z M 1240 645 L 1310 645 L 1310 700 L 1240 700 Z"></path>
        <path class="outline" data-hotspot="door" d="M 1510 700 L 1510 220 L 1540 110 L 1585 70 L 1630 110 L 1672 220 L 1672 700 Z"></path>
      </svg>

      <div class="spot" data-spot="news" style="left:0.4%; top:9%; width:11.6%; height:37%">
        <button type="button" class="hotspot" data-hotspot="news" aria-label="1 News"
          style="clip-path:polygon(1% 3%, 99% 1%, 99% 99%, 1% 100%)"></button>
        <span class="badge">1</span><span class="label">News</span>
      </div>

      <div class="spot" data-spot="research" style="left:20.5%; top:7.5%; width:21.8%; height:36%">
        <button type="button" class="hotspot" data-hotspot="research" aria-label="2 Research"
          style="clip-path:polygon(2% 5%, 98% 0.5%, 99% 95%, 2.5% 100%)"></button>
        <span class="badge">2</span><span class="label">Research</span>
      </div>

      <div class="spot" data-spot="profile" style="left:0.2%; top:51%; width:42.8%; height:45%">
        <button type="button" class="hotspot" data-hotspot="profile" aria-label="3 About"
          style="clip-path:polygon(0% 5%, 100% 0%, 100% 100%, 0% 100%)"></button>
        <span class="badge">3</span><span class="label">About</span>
      </div>

      <div class="spot" data-spot="notes" style="left:44%; top:2%; width:20.5%; height:71%">
        <button type="button" class="hotspot" data-hotspot="notes" aria-label="4 Notes"
          style="clip-path:polygon(0% 1%, 100% 0%, 100% 100%, 0% 100%)"></button>
        <span class="badge">4</span><span class="label">Notes</span>
      </div>

      <div class="spot" data-spot="quests" style="left:64.5%; top:50%; width:14.5%; height:24.5%">
        <button type="button" class="hotspot" data-hotspot="quests" aria-label="5 Side Quests"
          style="clip-path:polygon(1% 12%, 100% 4%, 100% 100%, 1% 100%)"></button>
        <span class="badge">5</span><span class="label">Side Quests</span>
      </div>

      <div class="spot" data-spot="door" style="left:90%; top:7.5%; width:10%; height:67%">
        <button type="button" class="hotspot" data-hotspot="door" aria-label="6 Enter"
          style="clip-path:polygon(2% 100%, 2% 25%, 18% 7%, 44% 0%, 72% 7%, 100% 25%, 100% 100%)"></button>
        <span class="badge">6</span><span class="label">Enter</span>
      </div>
    </div>

    <div class="bar">
      <label><input type="checkbox" id="boxes" checked> 显示热点框</label>
      <label><input type="checkbox" id="grid"> 显示 5% 网格</label>
      <span class="note">Debug v3 · 像素坐标描边 · 桌椅下调 · 书架右收 · 石凳左移</span>
    </div>
    <div class="legend">
      <span><b>1</b> News</span>
      <span><b>2</b> Research</span>
      <span><b>3</b> About</span>
      <span><b>4</b> Notes</span>
      <span><b>5</b> Side Quests</span>
      <span><b>6</b> Enter</span>
    </div>
  </main>

  <script>
    const stage = document.getElementById('stage');
    const boxes = document.getElementById('boxes');
    const grid = document.getElementById('grid');
    const outlines = new Map(
      [...document.querySelectorAll('.outline')].map((path) => [path.dataset.hotspot, path]),
    );

    function setActive(id, active) {
      const path = outlines.get(id);
      const spot = document.querySelector(`.spot[data-spot="${id}"]`);
      if (path) path.classList.toggle('is-active', active);
      if (spot) spot.classList.toggle('is-active', active);
    }

    for (const hotspot of document.querySelectorAll('.hotspot')) {
      const id = hotspot.dataset.hotspot;
      hotspot.addEventListener('pointerenter', () => setActive(id, true));
      hotspot.addEventListener('pointerleave', () => setActive(id, false));
      hotspot.addEventListener('focus', () => setActive(id, true));
      hotspot.addEventListener('blur', () => setActive(id, false));
    }

    boxes.addEventListener('change', () => {
      stage.classList.toggle('show-boxes', boxes.checked);
    });
    grid.addEventListener('change', () => {
      stage.classList.toggle('show-grid', grid.checked);
    });
  </script>
</body>
</html>
