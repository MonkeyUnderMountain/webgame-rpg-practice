<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mage Study · Light FX Preview</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: #0b0d12;
      color: #e8e2d7;
      font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .preview {
      width: min(1672px, 100vw);
      margin: 0 auto;
      padding: 18px 18px 28px;
    }
    .stage {
      --fx: 1;
      position: relative;
      aspect-ratio: 1672 / 941;
      overflow: hidden;
      background: #0b0d12;
      box-shadow: 0 20px 80px #0008;
    }
    .stage img {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      user-select: none;
    }
    .fx {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .glow {
      position: absolute;
      border-radius: 50%;
      mix-blend-mode: screen;
      filter: blur(10px);
      transform: translate(-50%, -50%);
      will-change: opacity, transform;
    }
    .candle {
      background: radial-gradient(circle,
        rgb(255 208 130 / 95%) 0%,
        rgb(255 154 66 / 42%) 34%,
        transparent 70%);
      animation: flicker 3.4s ease-in-out infinite;
    }
    .c1 { left: 35.9%; top: 54.7%; width: 6%; height: 10%; animation-duration: 2.9s; animation-delay: -0.4s; }
    .c2 { left: 18.1%; top: 23.9%; width: 4%; height: 7%; animation-duration: 3.7s; animation-delay: -1.6s; }
    .c3 { left: 77.4%; top: 56.8%; width: 4.5%; height: 8%; animation-duration: 4.3s; animation-delay: -2.7s; }
    .window-light,
    .door-light {
      background: radial-gradient(circle,
        rgb(156 178 255 / 34%) 0%,
        rgb(118 124 220 / 14%) 42%,
        transparent 72%);
      animation: breathe 9s ease-in-out infinite;
    }
    .window-light { left: 89.5%; top: 24%; width: 13%; height: 28%; animation-delay: -2s; }
    .door-light { left: 96.5%; top: 30%; width: 8%; height: 24%; animation-delay: -5s; }
    .star {
      position: absolute;
      width: 0.28%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #d9f4ff;
      box-shadow: 0 0 6px 1px #9fdcffcc;
      animation: twinkle 4.6s ease-in-out infinite;
    }
    .s1 { left: 24%; top: 18%; animation-delay: -0.7s; }
    .s2 { left: 31.5%; top: 27%; animation-delay: -2.2s; animation-duration: 5.4s; }
    .s3 { left: 39%; top: 37%; animation-delay: -3.4s; animation-duration: 3.8s; }
    .dust {
      position: absolute;
      width: 0.22%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #ffe2b8;
      box-shadow: 0 0 5px #ffd9a080;
      animation: drift 18s linear infinite;
    }
    .d1 { left: 12%; top: 42%; animation-delay: -3s; }
    .d2 { left: 55%; top: 29%; animation-delay: -8s; animation-duration: 22s; }
    .d3 { left: 70%; top: 46%; animation-delay: -12s; animation-duration: 16s; }
    .d4 { left: 44%; top: 70%; animation-delay: -6s; animation-duration: 20s; }
    .d5 { left: 85%; top: 64%; animation-delay: -15s; animation-duration: 24s; }

    @keyframes flicker {
      0%, 100% { opacity: calc(var(--fx) * 0.56); transform: translate(-50%, -50%) scale(0.98); }
      16% { opacity: calc(var(--fx) * 0.78); transform: translate(-50%, -50%) scale(1.03); }
      31% { opacity: calc(var(--fx) * 0.48); transform: translate(-50%, -50%) scale(0.97); }
      47% { opacity: calc(var(--fx) * 0.82); transform: translate(-50%, -50%) scale(1.04); }
      63% { opacity: calc(var(--fx) * 0.52); transform: translate(-50%, -50%) scale(0.99); }
      79% { opacity: calc(var(--fx) * 0.72); transform: translate(-50%, -50%) scale(1.02); }
      91% { opacity: calc(var(--fx) * 0.46); transform: translate(-50%, -50%) scale(0.98); }
    }
    @keyframes breathe {
      0%, 100% { opacity: calc(var(--fx) * 0.22); transform: translate(-50%, -50%) scale(1); }
      50% { opacity: calc(var(--fx) * 0.38); transform: translate(-50%, -50%) scale(1.03); }
    }
    @keyframes twinkle {
      0%, 100% { opacity: calc(var(--fx) * 0.18); transform: scale(0.8); }
      45% { opacity: calc(var(--fx) * 0.8); transform: scale(1.15); }
      60% { opacity: calc(var(--fx) * 0.35); transform: scale(0.95); }
    }
    @keyframes drift {
      0% { opacity: 0; transform: translate3d(0, 8px, 0); }
      18% { opacity: calc(var(--fx) * 0.3); }
      60% { opacity: calc(var(--fx) * 0.16); }
      100% { opacity: 0; transform: translate3d(14px, -46px, 0); }
    }

    .bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 18px;
      padding: 14px 2px 0;
      color: #bcbac2;
      font-size: 13px;
    }
    .bar label { display: inline-flex; align-items: center; gap: 8px; }
    .bar input[type="range"] { width: 130px; accent-color: #edc38b; }
    .bar input[type="checkbox"] { accent-color: #edc38b; }
    .bar .note { margin-left: auto; color: #7e7d88; }

    .stage.no-motion .glow,
    .stage.no-motion .star,
    .stage.no-motion .dust {
      animation: none !important;
    }
    .stage.no-motion .candle { opacity: 0.5; }
    .stage.no-motion .window-light,
    .stage.no-motion .door-light { opacity: 0.25; }
    .stage.no-motion .star { opacity: 0.5; }
    .stage.no-motion .dust { opacity: 0; }

    @media (prefers-reduced-motion: reduce) {
      .glow, .star, .dust { animation: none !important; }
    }
    @media (max-width: 680px) {
      .preview { padding: 10px 10px 20px; }
      .bar { gap: 12px; }
      .bar .note { width: 100%; margin-left: 0; }
    }
  </style>
</head>
<body>
  <main class="preview">
    <div class="stage" id="stage">
      <img src="../shortlist/09s-pixel-vivid-b-96.png" alt="Mage study, 96-color pixel-art version with candle and window light effects.">
      <div class="fx" aria-hidden="true">
        <span class="glow candle c1"></span>
        <span class="glow candle c2"></span>
        <span class="glow candle c3"></span>
        <span class="glow window-light"></span>
        <span class="glow door-light"></span>

        <span class="star s1"></span>
        <span class="star s2"></span>
        <span class="star s3"></span>

        <span class="dust d1"></span>
        <span class="dust d2"></span>
        <span class="dust d3"></span>
        <span class="dust d4"></span>
        <span class="dust d5"></span>
      </div>
    </div>

    <div class="bar">
      <label><input type="checkbox" id="motion" checked> 动效</label>
      <label>强度 <input type="range" id="strength" min="0.35" max="1.6" step="0.05" value="1"></label>
      <span class="note">Preview only · 96-color base · 烛光 / 窗光 / 星点 / 灰尘</span>
    </div>
  </main>

  <script>
    const stage = document.getElementById('stage');
    const motion = document.getElementById('motion');
    const strength = document.getElementById('strength');

    motion.addEventListener('change', () => {
      stage.classList.toggle('no-motion', !motion.checked);
    });

    strength.addEventListener('input', () => {
      stage.style.setProperty('--fx', strength.value);
    });
  </script>
</body>
</html>
